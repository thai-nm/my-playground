apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-service
  namespace: kic-dev
  annotations:
    konghq.com/strip-path: "true"
spec:
  parentRefs:
    - name: kong
      namespace: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /task
      backendRefs:
        - name: task-service
          kind: Service
          port: 8080
